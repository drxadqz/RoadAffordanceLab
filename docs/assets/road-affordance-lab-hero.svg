    <circle cx="825" cy="92" r="7"/><circle cx="914" cy="198" r="7"/>
  </g>
  <text x="72" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="500" fill="#FFFFFF" text-anchor="start">RoadAffordanceLab</text>
  <text x="72" y="143" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#D7E8FF" text-anchor="start">Factor-aware road-surface intelligence</text>
  <text x="72" y="201" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">From physical evidence to auditable decisions</text>
  <g>
