    <rect x="270" y="242" width="170" height="42" rx="21" fill="#FFFFFF" opacity="0.14"/>
    <rect x="454" y="242" width="202" height="42" rx="21" fill="#FFFFFF" opacity="0.14"/>
  <text x="164" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Physics-guided</text>
  <text x="355" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Factor-coupled</text>
  <text x="555" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Reproducible</text>
