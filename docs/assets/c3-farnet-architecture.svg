<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">C3-FaRNet architecture</title>
  <desc id="desc">RGB input is processed by visual and physics evidence branches, combined through factor coupling and a hard-pair head, and emitted as 27 classes.</desc>
  <rect width="1200" height="520" rx="24" fill="#F8FAFC"/>
  <text x="54" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#0F172A" text-anchor="start">C3-FaRNet · coupled evidence pipeline</text>
  <text x="54" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">One image, three factor views, one auditable 27-class decision</text>
  <line x1="190" y1="250" x2="276" y2="170" stroke="#94A3B8" stroke-width="3"/>
  <path d="M276 170 l-12 -7 v14 z" fill="#94A3B8"/>
  <line x1="190" y1="266" x2="276" y2="350" stroke="#94A3B8" stroke-width="3"/>
  <path d="M276 350 l-12 -7 v14 z" fill="#94A3B8"/>
  <line x1="480" y1="170" x2="570" y2="250" stroke="#94A3B8" stroke-width="3"/>
  <path d="M570 250 l-12 -7 v14 z" fill="#94A3B8"/>
  <line x1="480" y1="350" x2="570" y2="270" stroke="#94A3B8" stroke-width="3"/>
  <path d="M570 270 l-12 -7 v14 z" fill="#94A3B8"/>
  <line x1="760" y1="260" x2="825" y2="260" stroke="#94A3B8" stroke-width="3"/>
  <path d="M825 260 l-12 -7 v14 z" fill="#94A3B8"/>
  <line x1="995" y1="260" x2="1030" y2="260" stroke="#94A3B8" stroke-width="3"/>
  <path d="M1030 260 l-12 -7 v14 z" fill="#94A3B8"/>
  <rect x="40" y="210" width="150" height="100" rx="18" fill="#FFFFFF" stroke="#155EEF" stroke-width="3"/>
  <text x="115.0" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#155EEF" text-anchor="middle">RGB image</text>
  <text x="115.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">192×192</text>
  <rect x="276" y="115" width="204" height="110" rx="18" fill="#FFFFFF" stroke="#155EEF" stroke-width="3"/>
  <text x="378.0" y="155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#155EEF" text-anchor="middle">Visual carrier</text>
  <text x="378.0" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">ConvNeXt context</text>
  <rect x="276" y="295" width="204" height="110" rx="18" fill="#FFFFFF" stroke="#0891B2" stroke-width="3"/>
  <text x="378.0" y="335" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#0891B2" text-anchor="middle">Physics evidence</text>
  <text x="378.0" y="365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">wetness · texture</text>
  <rect x="570" y="200" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
  <text x="665.0" y="240" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#7C3AED" text-anchor="middle">Factor coupling</text>
  <text x="665.0" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">condition × material</text>
  <rect x="825" y="205" width="170" height="110" rx="18" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
  <text x="910.0" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#F97316" text-anchor="middle">Hard-pair head</text>
  <text x="910.0" y="275" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">boundary residuals</text>
  <rect x="1030" y="210" width="135" height="100" rx="18" fill="#FFFFFF" stroke="#155EEF" stroke-width="3"/>
  <text x="1097.5" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#155EEF" text-anchor="middle">27 classes</text>
  <text x="1097.5" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">single model</text>
  <rect x="565" y="370" width="164" height="42" rx="21" fill="#DBEAFE"/>
  <text x="647.0" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#155EEF" text-anchor="middle">condition / friction</text>
  <rect x="744" y="370" width="130" height="42" rx="21" fill="#CFFAFE"/>
  <text x="809.0" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#0E7490" text-anchor="middle">material</text>
  <rect x="889" y="370" width="144" height="42" rx="21" fill="#FFEDD5"/>
  <text x="961.0" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#C2410C" text-anchor="middle">roughness</text>
  <text x="600" y="472" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">The physics branch conditions difficult decisions; it does not claim to measure physical friction directly.</text>
</svg>
