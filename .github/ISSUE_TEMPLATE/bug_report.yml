name: Bug or reproducibility issue
description: Report a reproducible problem in code, configuration, checkpoints, or documentation.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make the release more reproducible. Do not include private dataset paths or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and config
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CUDA, GPU, and whether `git lfs pull` completed.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or audit output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed local paths, tokens, passwords, and private data from this report.
          required: true
