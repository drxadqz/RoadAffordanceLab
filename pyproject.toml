[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friction-affordance-field"
version = "0.1.0"
description = "DREL-QRFME road-surface recognition with full-RSCD training, factor-aware evidence modeling, and auditable evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "scikit-learn",
  "tqdm",
  "opencv-python",
  "tensorboard",
  "timm",
]

[project.urls]
Homepage = "https://github.com/drxadqz/RoadAffordanceLab"
Documentation = "https://github.com/drxadqz/RoadAffordanceLab/tree/main/docs"
Repository = "https://github.com/drxadqz/RoadAffordanceLab.git"
Issues = "https://github.com/drxadqz/RoadAffordanceLab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
